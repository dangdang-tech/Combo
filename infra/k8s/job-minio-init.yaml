apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-init-script
data:
  init-buckets.sh: |
    #!/bin/sh
    # 只确保不可变 Agent Package 使用的 combo-artifacts 存在；绝不删除桶或业务对象。
    set -eu

    S3_ENDPOINT="${S3_ENDPOINT:-http://minio:9000}"
    S3_ACCESS_KEY="${S3_ACCESS_KEY:-minioadmin}"
    S3_SECRET_KEY="${S3_SECRET_KEY:-minioadmin}"

    # 配置别名（重试等待 minio 起来；healthcheck 已 gate，这里只做容错重试）
    i=0
    until mc alias set local "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY" >/dev/null 2>&1; do
      i=$((i + 1))
      if [ "$i" -ge 30 ]; then
        echo "[init-buckets] cannot reach minio at $S3_ENDPOINT" >&2
        exit 1
      fi
      sleep 2
    done

    mc mb --ignore-existing local/combo-artifacts
    echo "[init-buckets] ensured bucket 'combo-artifacts'"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  labels:
    app: minio-init
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: minio/mc
          command: ['/bin/sh', '/scripts/init-buckets.sh']
          env:
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: combo-env
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: combo-env
                  key: S3_SECRET_KEY
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: minio-init-script
            defaultMode: 0555
